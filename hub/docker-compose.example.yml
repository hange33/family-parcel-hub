services:
  parcel-hub:
    build: .
    container_name: parcel-hub
    restart: unless-stopped
    network_mode: host          # 与 qq-bridge 同网络，直接访问 127.0.0.1:8787
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config.hub.json:/app/config.hub.json
      - ./data:/app/data

  parcel-scrapers:
    image: python:3.11-slim
    container_name: parcel-scrapers
    restart: unless-stopped
    command: sh /app/bootstrap.sh
    environment:
      - TZ=Asia/Shanghai
      - PLAYWRIGHT_BROWSERS_PATH=/app/.pw-browsers
    ports:
      - "8791:8791"
    volumes:
      - .:/app
