name: build-apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 不锁版本：pubspec.lock 要求 flutter >=3.41.0（secure_store 插件 >=3.38.0）
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze lib/ || true

      - name: Unit tests
        run: flutter test || true

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/*.apk out/ 2>/dev/null || true
          cd out && sha256sum *.apk > SHA256SUMS.txt && ls -lh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: family-parcel-hub-apk
          path: out/*
          retention-days: 30
